name: Qualidade do Observatório

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificacoes-sem-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python scripts/verificar_arquivos_ci.py
      - run: python -m json.tool grafana/dashboard_observatorio.json >/dev/null
      - run: python grafana/gerar_dashboard.py --check
      - name: Suíte sem PostgreSQL externo
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/testes-unitarios.log"
      - name: Resumo dos testes sem PostgreSQL
        if: always()
        run: |
          echo "### Verificações estáticas e suíte sem PostgreSQL — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Os casos que exigem PostgreSQL devem aparecer como ignorados nesta execução.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/testes-unitarios.log" ]; then
            sed -n -E '/^Ran [0-9]+ tests|^OK|^FAILED|\.\.\. skipped /p' "$RUNNER_TEMP/testes-unitarios.log" >> "$GITHUB_STEP_SUMMARY"
          fi

  postgres-descartavel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Disponibilizar os binários PostgreSQL 16
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi
      - name: Suíte com PostgreSQL e verificador
        shell: bash
        env:
          PG_BIN_DIR: /usr/lib/postgresql/16/bin
        run: |
          set -o pipefail
          bash scripts/testar_postgres_local.sh 2>&1 | tee "$RUNNER_TEMP/testes-postgres.log"
      - name: Resumo do PostgreSQL descartável
        if: always()
        run: |
          echo "### PostgreSQL descartável — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/testes-postgres.log" ]; then
            sed -n -E '/^Ran [0-9]+ tests|^OK|^FAILED|\.\.\. skipped |^DIVERGÊNCIA|indicadores conferidos/p' "$RUNNER_TEMP/testes-postgres.log" >> "$GITHUB_STEP_SUMMARY"
          fi
